# musicfx.conf - describes this project to tools/check.sh and tools/record.sh. Shell syntax: no spaces around "=".
# The Killing Game Show: the in-game tune on Paula channels 0-2, the game's 25 effects mixed into channel 3.

NAME=kgs_mfx                                # program name inside dist/
SOURCES="kit/sys.c kit/mfx.c kit/mfx_cfg.s kit/mixer/mixer.asm kit/ptplayer/ptplayer.asm src/kgs_mfx.c"
CFLAGS="-Ikit"
CONFIG_DIR=examples                         # the folder that holds this project's mixer_config.i

# The effects mixer. These three override the same names in mixer_config.i and steer tools/sfx.py.
HQ=1                                        # 1: effects keep all 8 bits (costs CPU). 0: divided by VOICES (cheap)
VOICES=4                                    # effects that can sound at once (1-4)
PERIOD=428                                  # mixer rate = 3546895 / PERIOD Hz on PAL: 428 = 8287 Hz, the rate the
                                            # game plays 20 of its 25 effects at, so those pass through unchanged

# Source effects (WAV, from tools/kgs_extract.py); converted into assets/fx/*.raw. Effect 21 is played by the
# game at volume 20 of 64, every other one at 64: the @ gain keeps that balance.
EFFECTS="original/sfx/0?.wav original/sfx/1?.wav original/sfx/20.wav original/sfx/21.wav@0.3125 original/sfx/2[2-4].wav"
GAIN=1.0                                    # loudness of the converted effects

# Gates of the referee.
FRAMES=150                                  # frames per bench phase
MAX_CPU_PCT=15                              # audio may take this much of an Amiga 500 with all voices busy
